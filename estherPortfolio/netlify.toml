# Static site. Hand written HTML, no build step, no framework.
# Netlify's base directory for this site is `estherPortfolio`, so `.` is this folder.

[build]
  publish = "."

# No redirects. The old SPA catch-all (/* -> /index.html 200) has been removed:
# it would swallow real 404s and interfere with Netlify Forms.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
